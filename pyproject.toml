[project]
name = "jevdrive"
version = "0.1.0"
description = "Probing driving knowledge in frozen VLM latents"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.8",
  "torchvision>=0.23",
  "transformers>=4.57",
  "accelerate>=1.0",
  "nuscenes-devkit>=1.2",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "orjson>=3.10",
  "pillow>=10",
  "tabulate>=0.10.0",
  "tensorboard>=2.21.0",
  "tqdm>=4.70.1",
  "diffusers>=0.36",
]

[tool.uv]
package = false

# Aliyun PyPI mirror: the GPU box is in China, pypi.org is slow from there.
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
